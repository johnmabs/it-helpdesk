services:
  postgres:
    image: postgres:18-alpine
    container_name: it-helpdesk-postgres

    environment:
      POSTGRES_DB: it_helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d it_helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:18-alpine
    profiles: ["test"]

    environment:
      POSTGRES_DB: it_helpdesk_test
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk

    ports:
      - "5433:5432"

    tmpfs:
      - /var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d it_helpdesk_test"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
