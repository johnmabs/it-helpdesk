services:
  app:
    build:
      context: .
      target: runner

    environment:
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-helpdesk}@postgres:5432/${POSTGRES_DB:-it_helpdesk}?sslmode=disable

    ports:
      - "${APP_PORT:-3000}:3000"

    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-helpdesk}@postgres:5432/${POSTGRES_DB:-it_helpdesk}?sslmode=disable

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  postgres:
    image: postgres:18-alpine
    container_name: it-helpdesk-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_helpdesk}
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-helpdesk} -d ${POSTGRES_DB:-it_helpdesk}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  postgres-test:
    image: postgres:18-alpine
    profiles: ["test"]

    environment:
      POSTGRES_DB: it_helpdesk_test
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk

    ports:
      - "5433:5432"

    tmpfs:
      - /var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d it_helpdesk_test"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
