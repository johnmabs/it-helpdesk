services:
  postgres:
    image: postgres:18-alpine
    container_name: it-helpdesk-postgres

    environment:
      POSTGRES_DB: it_helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d it_helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
